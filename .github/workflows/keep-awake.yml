# Render's free plan puts the API to sleep after 15 minutes without traffic, and waking it takes 2+ minutes, so a
# sleeping API makes sign-in slow or fail.
#
# GitHub doesn't run scheduled workflows on time (the "every 30 minutes" schedule ran every 6–18 hours), so this job
# doesn't rely on the schedule: each run pings every 5 minutes for ~5h40m and then starts the next run itself, so
# there is always one running. The schedule is only a backup that restarts the chain if it ever breaks.
# (A run started with workflow_dispatch from GITHUB_TOKEN does start a new run; other events from it don't.)
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables → New variable
#   ARTH_API_URL = https://arth-api.onrender.com   (your Render URL, no trailing slash)
# The health check doesn't touch the database (HEALTH_CHECK_DB=false), so the free Neon database can still sleep.
name: Keep API awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# one pinger at a time: a newer run replaces the one before it
concurrency:
  group: keep-awake
  cancel-in-progress: true

permissions:
  actions: write # to start the next run
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.ARTH_API_URL != '' }}
    timeout-minutes: 355
    steps:
      - name: Ping the health endpoint every 5 minutes
        continue-on-error: true
        env:
          URL: ${{ vars.ARTH_API_URL }}/actuator/health
        run: |
          end=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if curl --fail --silent --show-error --max-time 150 --retry 2 --retry-delay 20 -o /dev/null "$URL"; then
              echo "$(date -u +%H:%M) awake"
            else
              echo "::warning::$(date -u +%H:%M) no answer from the API"
            fi
            sleep 300
          done

      - name: Start the next run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keep-awake.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
