# Render's free plan puts the API to sleep after 15 minutes without traffic, and waking takes about a minute.
# This pings it every 10 minutes so it stays awake and its evening price refresh and hourly alert jobs keep running.
# One always-on free service fits in Render's 750 free hours a month.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables → New variable
#   ARTH_API_URL = https://arth-api.onrender.com   (your Render URL, no trailing slash)
# The health check doesn't touch the database (HEALTH_CHECK_DB=false), so the free Neon database can still sleep.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.ARTH_API_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 20 "${{ vars.ARTH_API_URL }}/actuator/health"
